{{- range $name, $deploy := .Values.deployments }}
{{- if $deploy.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  {{- if ($deploy.service.ingress).httpsBackend }}
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: {{ $.Release.Namespace }}-{{ $name }}-transport@kubernetescrd
  {{- end }}
  labels:
    {{- include "selectorLabels" (dict "name" $name "ctx" $) | nindent 4}}
    {{- include "app.labels" $ | nindent 4 }}
spec:
  type: {{ $deploy.service.type | default "ClusterIP" }}
  ports:
  {{- range $deploy.service.ports }}
    - port: {{ .port | default .containerPort }}
      targetPort: {{ .name }}
      protocol: {{ .protocol }}
      name: {{ .name }}
  {{- end }}
  {{- with $deploy.sidecar }}
  {{- range . }}
  {{- range .ports }}
    - port: {{ .port | default .containerPort }}
      targetPort: {{ .name }}
      protocol: {{ .protocol }}
      name: {{ .name }}
  {{- end }}
  {{- end }}
  {{- end }}
  selector: 
    {{- include "selectorLabels" (dict "name" $name "ctx" $) | nindent 4}}
{{- if ($deploy.service.ingress).httpsBackend }}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ $name }}-transport
spec:
  insecureSkipVerify: true
{{- end }}
{{- end }}
{{- end }}

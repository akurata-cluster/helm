{{- range $name, $deploy := .Values.deployments }}
{{- if $deploy.service }}
{{- if ($deploy.service.ingress).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  {{- if ne ($deploy.service.ingress).tls false }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-{{ $name }}-middleware@kubernetescrd
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  {{- end }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - backend:
          service:
            name: {{ $name }}
            port:
              name: http
        path: /
        pathType: ImplementationSpecific
    {{- if ($deploy.service.ingress).host }}
    host: {{ $deploy.service.ingress.host }}
    {{- else }}
    host: {{ $name }}.app.home
    {{- end }} 
{{- if ne ($deploy.service.ingress).tls false }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-middleware
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- range $name, $deploy := .Values.deployments }}
{{- if ($deploy.service).ingress }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  {{- if ne ($deploy.service).tls false }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-{{ $name }}-middleware@kubernetescrd
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  {{- end }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
  - host: {{ $name }}.app.home
    http:
      paths:
      - backend:
          service:
            name: {{ $name }}
            port:
              name: http
        path: /
        pathType: ImplementationSpecific
{{- if ne ($deploy.service).tls false }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-middleware
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
{{- end }}
{{- end }}

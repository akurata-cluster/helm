{{- range $name, $lws := .Values.vllm }}
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: {{ $name }}
spec:
  replicas: {{ $lws.leaderReplicaCount | default 1 }}
  leaderWorkerTemplate:
    size: {{ $lws.workerReplicaCount | default 2 }}
    restartPolicy: {{ $lws.restartPolicy | default "RecreateGroupOnPodRestart" }}
    leaderTemplate:
      metadata:
        labels:
          {{- include "selectorLabels" (dict "name" $name "ctx" $) | nindent 10 }}
      spec:
        nodeSelector:
          kubernetes.io/hostname: {{ $lws.leaderNode }}
        runtimeClassName: nvidia
        hostNetwork: true
        hostIPC: true
        dnsPolicy: ClusterFirstWithHostNet
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        containers:
        - name: leader
          image: "{{ $lws.image.repository }}"
          imagePullPolicy: {{ $lws.image.pullPolicy }}
          securityContext:
            privileged: true
            capabilities:
              add: ["IPC_LOCK"]
          command: ["/bin/bash", "-l", "/scripts/entrypoint.sh"]
          env:
          - name: NODE_RANK
            value: "0"
          - name: VLLM_HOST_IP
            value: "99.99.99.1"
          envFrom:
          - configMapRef:
              name: {{ $name }}-env
          {{- with $lws.envFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          resources:
            limits:
              nvidia.com/gpu: 1
          {{- with ($lws.service).ports }}
          ports:
          {{- range . }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol }}
          {{- end }}
          {{- end }}
          {{- with ($lws.probes).livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with ($lws.probes).readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with ($lws.probes).startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
            {{- with $lws.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: {{ $lws.dshmSize | default "64Gi" }}
          - name: tmp
            emptyDir: {}
          - name: scripts
            configMap:
              name: {{ $name }}-entrypoint-script
              defaultMode: 0755
          {{- with $lws.volumes }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
    workerTemplate:
      spec:
        nodeSelector:
          kubernetes.io/hostname: {{ $lws.workerNode }}
        runtimeClassName: nvidia
        hostNetwork: true
        hostIPC: true
        dnsPolicy: ClusterFirstWithHostNet
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        containers:
        - name: worker
          image: "{{ $lws.image.repository }}"
          imagePullPolicy: {{ $lws.image.pullPolicy }}
          securityContext:
            privileged: true
            capabilities:
              add: ["IPC_LOCK"]
          command: ["/bin/bash", "-l", "/scripts/entrypoint.sh"]
          env:
          - name: NODE_RANK
            value: "1"
          - name: VLLM_HOST_IP
            value: "99.99.99.2"
          envFrom:
          - configMapRef:
              name: {{ $name }}-env
          {{- with $lws.envFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
            {{- with $lws.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: {{ $lws.dshmSize | default "64Gi" }}
          - name: tmp
            emptyDir: {}
          - name: scripts
            configMap:
              name: {{ $name }}-entrypoint-script
              defaultMode: 0755
          {{- with $lws.volumes }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
{{- end }}
